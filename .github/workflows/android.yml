name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout your project
      # ---------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Java 17
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # Android SDK + NDK
      #
      # GitHub's Ubuntu runner already contains the Android SDK.
      # Use sdkmanager directly rather than setup-android.
      # ---------------------------------------------------------
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -name sdkmanager \
              -type f \
              | head -n 1)"
          fi

          echo "Using sdkmanager:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      # ---------------------------------------------------------
      # Set NDK environment
      # ---------------------------------------------------------
      - name: Configure Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/26.1.10909125"

          test -d "$NDK_PATH"

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          echo "NDK:"
          "$NDK_PATH/ndk-build" --version

      # ---------------------------------------------------------
      # Checkout AndroidX Media3 1.5.1
      # ---------------------------------------------------------
      - name: Checkout AndroidX Media3 1.5.1
        uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: 1.5.1
          path: media
          fetch-depth: 1

      # ---------------------------------------------------------
      # Prepare FFmpeg 6.0
      # ---------------------------------------------------------
      - name: Download FFmpeg 6.0
        shell: bash
        run: |
          set -euxo pipefail

          FFMPEG_DIR="media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg"

          rm -rf "$FFMPEG_DIR"

          git clone \
            --branch release/6.0 \
            --depth 1 \
            https://github.com/FFmpeg/FFmpeg.git \
            "$FFMPEG_DIR"

          test -f "$FFMPEG_DIR/configure"

          echo "FFmpeg source prepared:"
          "$FFMPEG_DIR/ffmpeg -version" 2>/dev/null || true

      # ---------------------------------------------------------
      # Build Media3 FFmpeg decoder
      # ---------------------------------------------------------
      - name: Build Media3 FFmpeg decoder
        shell: bash
        working-directory: media
        run: |
          set -euxo pipefail

          chmod +x libraries/decoder_ffmpeg/src/main/jni/build_ffmpeg.sh

          cd libraries/decoder_ffmpeg/src/main/jni

          ./build_ffmpeg.sh \
            ../../main \
            "$ANDROID_NDK_HOME" \
            linux-x86_64 \
            21 \
            aac \
            ac3 \
            eac3 \
            flac \
            mp3 \
            opus \
            vorbis \
            pcm_alaw \
            pcm_mulaw

      # ---------------------------------------------------------
      # Verify FFmpeg output
      # ---------------------------------------------------------
      - name: Verify FFmpeg libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for generated native libraries..."

          find media/libraries/decoder_ffmpeg \
            -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

      # ---------------------------------------------------------
      # Gradle
      # ---------------------------------------------------------
      - name: Grant execute permission
        run: chmod +x gradlew

      # ---------------------------------------------------------
      # Build APK
      # ---------------------------------------------------------
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
