name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout your DVD-DOWNLOADER project
      # ---------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Checkout AndroidX Media3 1.5.1
      #
      # This is required because
      # androidx.media3:media3-decoder-ffmpeg:1.5.1
      # is NOT published to Google Maven.
      #
      # It will create:
      #
      # media/
      # ├── build-logic-settings/
      # ├── libraries/
      # │   └── decoder_ffmpeg/
      # └── ...
      # ---------------------------------------------------------
      - name: Checkout AndroidX Media3 1.5.1
        uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: 1.5.1
          path: media
          fetch-depth: 1

      # ---------------------------------------------------------
      # 4. Install Android SDK components
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 5. Install NDK 26.1.10909125
      #
      # Media3 FFmpeg build is documented/tested around NDK r26b.
      # 26.1.10909125 is the Android SDK package corresponding
      # to NDK r26b.
      # ---------------------------------------------------------
      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager "platform-tools"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;26.1.10909125"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 6. Verify the NDK
      # ---------------------------------------------------------
      - name: Verify Android NDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"

          "$ANDROID_NDK_HOME/ndk-build" --version

      # ---------------------------------------------------------
      # 7. Prepare FFmpeg source directory
      #
      # AndroidX expects:
      #
      # media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg
      # ---------------------------------------------------------
      - name: Prepare FFmpeg
        shell: bash
        working-directory: media
        run: |
          set -e

          FFMPEG_MODULE_PATH="$PWD/libraries/decoder_ffmpeg/src/main"

          mkdir -p "$FFMPEG_MODULE_PATH/jni"

          if [ ! -d "$FFMPEG_MODULE_PATH/jni/ffmpeg/.git" ]; then
            git clone \
              --branch release/6.0 \
              --depth 1 \
              https://github.com/FFmpeg/FFmpeg.git \
              "$FFMPEG_MODULE_PATH/jni/ffmpeg"
          fi

          echo "FFMPEG_MODULE_PATH=$FFMPEG_MODULE_PATH" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 8. Build FFmpeg for Android
      #
      # These are FFmpeg AUDIO decoders used by the official
      # Media3 decoder_ffmpeg module.
      #
      # Add/remove decoder names here if your application needs
      # a different codec set.
      # ---------------------------------------------------------
      - name: Build FFmpeg native libraries
        shell: bash
        working-directory: media
        run: |
          set -e

          FFMPEG_MODULE_PATH="$PWD/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$ANDROID_NDK_HOME"
          HOST_PLATFORM="linux-x86_64"

          # Must be >= 21 for the Media3 FFmpeg build.
          ANDROID_ABI=21

          ENABLED_DECODERS=(
            aac
            ac3
            eac3
            flac
            mp3
            opus
            vorbis
            pcm_alaw
            pcm_mulaw
          )

          cd "$FFMPEG_MODULE_PATH/jni"

          chmod +x build_ffmpeg.sh

          ./build_ffmpeg.sh \
            "$FFMPEG_MODULE_PATH" \
            "$NDK_PATH" \
            "$HOST_PLATFORM" \
            "$ANDROID_ABI" \
            "${ENABLED_DECODERS[@]}"

      # ---------------------------------------------------------
      # 9. Show generated FFmpeg files
      #
      # This makes the GitHub Actions log useful if the build
      # fails later.
      # ---------------------------------------------------------
      - name: Verify FFmpeg build output
        shell: bash
        run: |
          set -e

          echo "FFmpeg directory:"
          find media/libraries/decoder_ffmpeg/src/main/jni/ffmpeg \
            -maxdepth 2 \
            -type f \
            | head -50

          echo
          echo "Native libraries:"
          find media/libraries/decoder_ffmpeg/src/main \
            -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

      # ---------------------------------------------------------
      # 10. Make Gradle executable
      # ---------------------------------------------------------
      - name: Grant execute permission
        run: chmod +x gradlew

      # ---------------------------------------------------------
      # 11. Build APK
      #
      # Your existing dependency:
      #
      # implementation(
      #     "androidx.media3:media3-decoder-ffmpeg:1.5.1"
      # )
      #
      # will now resolve from the local AndroidX Media3 checkout.
      # ---------------------------------------------------------
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      # ---------------------------------------------------------
      # 12. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
